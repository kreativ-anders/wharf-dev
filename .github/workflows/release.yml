name: Release

# INFO: The repository's only workflow: gate → (bump) → build on each OS → one
# atomic release. There is deliberately no push/PR CI — `make check` runs
# locally before a commit (CLAUDE.md §4). The why behind each part, and the
# two ways to cut a release, are in dev/releasing.md:
#
#   A) by hand: `make release BUMP=minor`, then push the commit and the tag.
#   B) by button: Actions → Release → "Run workflow" with bump patch/minor/major
#      (or an exact version). Bump, build and release then all happen in this
#      one run — a push made with GITHUB_TOKEN never starts another workflow.
#
# "Run workflow" with bump "none" is a test build: all three platforms are
# built and attached to the run as artifacts, and nothing is released.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = test build, no release)"
        type: choice
        options: [none, patch, minor, major]
        default: none
      version:
        description: "Exact version X.Y.Z instead of a bump"
        type: string
        required: false
        default: ""

permissions:
  contents: write

# WARNING: Two runs bumping from the same gui/pubspec.yaml would claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # WARNING: Pinned, not floating: a new Flutter can change what a tagged build
  # produces without a commit here. Raise it deliberately, after `make check`
  # passes locally on the new version. Go is pinned by daemon/go.mod.
  FLUTTER_VERSION: "3.47.4"

jobs:
  # INFO: Nothing is bumped, built or released unless this is green.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache: false # no dependencies to cache

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # WARNING: A tag that disagrees with the pubspec would ship assets named after
      # one version and an app that reports another.
      - name: Tag matches gui/pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: bash tool/version.sh check-tag "$GITHUB_REF_NAME"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l daemon)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-ed (run make fmt): $unformatted"
            exit 1
          fi

      # INFO: Both halves, both sync guards, the GUI against the real daemon, and
      # every OS the daemon must still compile for.
      - run: make check cross

  # INFO: Only for a dispatch with a bump or an exact version.
  bump:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && (inputs.bump != 'none' || inputs.version != '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, so an existing one is refused

      # WARNING: The input goes through env, never into the script text: a version
      # field is free text, and ${{ }} in `run:` is pasted in unquoted.
      - name: Bump, commit and tag
        id: bump
        env:
          WANT: ${{ inputs.version || inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(bash tool/version.sh release "$WANT")"
          # WARNING: Atomic: never a pushed tag whose version commit did not land.
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [gate, bump]
    # WARNING: `!cancelled()` is load-bearing, not decoration. `bump` is skipped on a
    # tag push and on "bump: none", and GitHub skips every job that `needs` a
    # skipped one — unless the condition contains a status-check function.
    # `needs.bump.result == 'skipped'` alone reads right and does not work:
    # only the bump-button path would ever build, and the run still shows
    # green. `!cancelled()` rather than `always()`, so a cancelled run stops.
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    strategy:
      fail-fast: true # one missing platform means no release anyway
      matrix:
        include:
          - { platform: macos, os: macos-latest }
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}
          fetch-depth: 0 # `version.sh describe` needs the tags

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # WARNING: Read once, before anything builds: a build step that touches a
      # tracked file would otherwise stamp a release as ".dirty". Make, the
      # Xcode build phase and the Windows CMake target all read VERSION.
      - name: Version
        run: |
          v="$(bash tool/version.sh describe)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=${v//+/-}" >> "$GITHUB_ENV"

      - name: Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev

      # INFO: macOS and Windows build wharfd inside the Flutter build (the "Embed
      # wharfd" Xcode phase, universal for a release build; the CMake target in
      # gui/windows/runner). Linux has no such hook yet, so the bundle gets it
      # copied in below.
      - name: Build
        run: |
          if [ "$PLATFORM" = linux ]; then make build; fi
          cd gui && flutter build "$PLATFORM" --release

      - name: Put wharfd in the Linux bundle
        if: matrix.platform == 'linux'
        run: cp build/wharfd gui/build/linux/x64/release/bundle/

      # WARNING: Flutter's Windows template links the VC++ runtime dynamically. Without
      # these three DLLs next to the exe, a machine that lacks the
      # redistributable fails at start with STATUS_DLL_NOT_FOUND — which
      # finanzgecko learned from winget's validation VM. App-local copies
      # need no admin rights and cover plugin DLLs too.
      - name: VC++ runtime next to the exe
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dest = "$PWD\gui\build\windows\x64\runner\Release"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt").Trim()
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\$redist\x64" -Directory -Filter "Microsoft.VC*.CRT" |
            Select-Object -First 1 -ExpandProperty FullName
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $src = Join-Path $crt $dll
            if (-not (Test-Path $src)) { throw "VC++ runtime DLL not found: $src" }
            Copy-Item $src $dest
          }

      # INFO: The release must ship the daemon it claims: stamped with this version,
      # and on macOS for both architectures the app itself runs on.
      - name: Check the embedded wharfd
        run: |
          case "$PLATFORM" in
            macos)
              bin=gui/build/macos/Build/Products/Release/Wharf.app/Contents/MacOS/wharfd
              archs="$(lipo -archs "$bin")"
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::wharfd is $archs, not universal"; exit 1; } ;;
            linux) bin=gui/build/linux/x64/release/bundle/wharfd ;;
            windows) bin=gui/build/windows/x64/runner/Release/wharfd.exe ;;
          esac
          got="$("$bin" --version | tr -d '\r')"
          [ "$got" = "wharfd $VERSION" ] || { echo "::error::$bin reports \"$got\", expected \"wharfd $VERSION\""; exit 1; }

      # INFO: A temporary keychain rather than the login one: deleted at the end of
      # the job (below, `always()`), and its random password is never logged.
      # Without the secrets — a fork — this is skipped and build_dmg.sh makes
      # an unsigned DMG instead of blocking the release.
      - name: Signing certificate and notarisation key
        if: matrix.platform == 'macos'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::notice::No signing certificate — the DMG will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # WARNING: Without the partition list codesign asks the keychain interactively
          # and the job hangs silently until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" >/dev/null
          # WARNING: Without this, `security find-identity` does not see the keychain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # INFO: One versioned file per platform, and no unversioned copy beside it:
      # a duplicate doubles every upload for nothing. The file-name suffixes
      # are what a future update check will look for — rename them together.
      # macOS goes through the same script `make dmg` runs locally.
      # TODO: replace the Linux tarball and Windows zip with an AppImage and an
      # installer once packaging exists (README "Status"); the steps above stay.
      - name: Package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # WARNING: A real release from this repository must be notarised: an unsigned
          # DMG on a release page is an app Gatekeeper refuses on every other
          # Mac. Forks and test builds keep the unsigned fallback.
          REQUIRE_NOTARIZED: >-
            ${{ github.repository == 'kreativ-anders/wharf-dev' &&
                (startsWith(github.ref, 'refs/tags/') || needs.bump.result == 'success') && '1' || '' }}
        run: |
          name="Wharf-$ASSET_VERSION"
          case "$PLATFORM" in
            macos)
              OUT_FILE="$PWD/$name-mac.dmg" ./packaging/macos/build_dmg.sh ;;
            linux)
              tar -C gui/build/linux/x64/release -czf "$name-linux-x64.tar.gz" bundle ;;
            windows)
              pwsh -NoProfile -Command "Compress-Archive -Path gui/build/windows/x64/runner/Release/* -DestinationPath '$name-windows-x64.zip'" ;;
          esac

      # WARNING: `always()`: no decrypted key may stay on the runner after a failure.
      - name: Remove the keychain and the notarisation key
        if: always() && matrix.platform == 'macos'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: wharf-${{ matrix.platform }}
          path: Wharf-*
          if-no-files-found: error

  # INFO: Published only once every platform built: one step, so there is never a
  # release missing a platform's file. A test build ("bump: none") stops
  # before this.
  release:
    needs: [bump, build]
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.bump.result == 'success' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # INFO: CHANGELOG.md is written here and nowhere else.
      - name: CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tool/version.sh prepend-changelog "$TAG"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "📝 Changelog for $TAG"
          git push origin HEAD:main

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # WARNING: `sha256sum Wharf-*`, not `*`: the redirect creates SHA256SUMS before
      # the command runs, and `*` would hash the empty file into itself. The
      # notes claim integrity, not authenticity — SHA256SUMS is unsigned.
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum Wharf-* > SHA256SUMS)
          {
            bash tool/version.sh changelog "$TAG" | tail -n +3
            echo "### Checksums (SHA-256)"
            echo
            echo "Confirms a download is byte for byte the file this build produced:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Check with \`shasum -a 256 <file>\` (macOS, Linux) or \`certutil -hashfile <file> SHA256\` (Windows)."
          } > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Wharf ${{ env.TAG }}
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
