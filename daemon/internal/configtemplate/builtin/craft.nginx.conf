# Craft CMS, for nginx — a config template built into Wharf.
#
# The local-development config from nystudio107's nginx-craft, which Craft's
# knowledge base recommends for nginx: web/ is served, anything else goes to
# web/index.php, and nothing PHP generates is cached by the browser. Its
# "access_log off" gives way to the project's own log, and its fixed
# HTTP_HOST to the project's host name.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

server {
  {{listen}}
  {{ssl}}

  # General virtual host settings
  server_name {{server_name}};
  server_tokens off;
  root "{{root}}/web";
  index index.html index.htm index.php;
  charset utf-8;

  # Enable serving of static gzip files
  gzip_static on;

  # Enable server-side includes
  ssi on;

  # Disable limits on the maximum allowed size of the client request body
  client_max_body_size 0;

  # 404 error handler
  error_page 404 /index.php?$query_string;

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  # Root directory location handler
  location / {
    try_files $uri/index.html $uri $uri/ /index.php?$query_string;
  }

  # php-fpm configuration
  location ~ [^/]\.php(/|$) {
    try_files $uri $uri/ /index.php?$query_string;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass {{php}};
    fastcgi_index index.php;
    include "{{fastcgi}}";
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_HOST {{server_name}};

    # Don't allow browser caching of dynamically generated content
    add_header Last-Modified $date_gmt;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    if_modified_since off;
    expires off;
    etag off;

    fastcgi_intercept_errors off;
    fastcgi_buffer_size 16k;
    fastcgi_buffers 4 16k;
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
  }

  # Disable reading of Apache .htaccess files
  location ~ /\.ht {
    deny all;
  }

  # Misc settings
  sendfile off;
}
