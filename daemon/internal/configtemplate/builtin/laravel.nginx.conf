# Laravel, for nginx — a config template built into Wharf.
#
# Laravel's nginx configuration from its deployment docs (Laravel 13):
# requests go to public/index.php, and nothing outside public/ is ever
# served. SCRIPT_FILENAME comes after the include, which sets it too.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

server {
  {{listen}}
  {{ssl}}
  server_name {{server_name}};
  root "{{root}}/public";

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";

  index index.php;

  charset utf-8;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  error_page 404 /index.php;

  location ~ ^/index\.php(/|$) {
    fastcgi_pass {{php}};
    include "{{fastcgi}}";
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_hide_header X-Powered-By;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
