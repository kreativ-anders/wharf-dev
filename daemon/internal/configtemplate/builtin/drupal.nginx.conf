# Drupal, for nginx — a config template built into Wharf.
#
# The Drupal recipe from the nginx wiki, for Drupal 7 and later, in a
# Composer project (drupal/recommended-project), which serves web/. Lines
# for Drupal 6 and PHP 5 are left out. "expires max" is commented out: a
# browser caching CSS forever hides every change while developing.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

server {
  {{listen}}
  {{ssl}}
  server_name {{server_name}};
  root "{{root}}/web";

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  # Very rarely should these ever be accessed outside of your lan
  location ~* \.(txt|log)$ {
    allow 192.168.0.0/16;
    deny all;
  }

  location ~ \..*/.*\.php$ {
    return 403;
  }

  location ~ ^/sites/.*/private/ {
    return 403;
  }

  # Block access to scripts in site files directory
  location ~ ^/sites/[^/]+/files/.*\.php$ {
    deny all;
  }

  # Allow "Well-Known URIs" as per RFC 5785
  location ~* ^/.well-known/ {
    allow all;
  }

  # Block access to "hidden" files and directories whose names begin with a
  # period. This includes directories used by version control systems such
  # as Subversion or Git to store control files.
  location ~ (^|/)\. {
    return 403;
  }

  location / {
    try_files $uri /index.php?$query_string;
  }

  location @rewrite {
    rewrite ^ /index.php;
  }

  # Don't allow direct access to PHP files in the vendor directory.
  location ~ /vendor/.*\.php$ {
    deny all;
    return 404;
  }

  # Protect files and directories from prying eyes. The wiki anchors the file
  # names with "^", which a request path starting with "/" never matches;
  # "(^|/)" matches them as Drupal's own .htaccess does.
  location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|(^|/)(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|(^|/)#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
    deny all;
    return 404;
  }

  # In Drupal 8 and later, '.php' can also appear in the middle of a path, as
  # in update.php/selection. This rule allows that for update.php only.
  location ~ '\.php$|^/update.php' {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    # Ensure the php file exists. Mitigates CVE-2019-11043
    try_files $fastcgi_script_name =404;
    include "{{fastcgi}}";
    # Block httpoxy attacks. See https://httpoxy.org/.
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    fastcgi_pass {{php}};
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri @rewrite;
    # expires max;
    log_not_found off;
  }

  # Image styles are generated on first request.
  location ~ ^/sites/.*/files/styles/ {
    try_files $uri @rewrite;
  }

  # Handle private files through Drupal. Private file's path can come
  # with a language prefix.
  location ~ ^(/[a-z\-]+)?/system/files/ {
    try_files $uri /index.php?$query_string;
  }

  # Enforce clean URLs
  # Removes index.php from urls like www.example.com/index.php/my-page --> www.example.com/my-page
  if ($request_uri ~* "^(.*/)index\.php/(.*)") {
    return 307 $1$2;
  }
}
