# Symfony, for Apache — a config template built into Wharf.
#
# Symfony's Apache configuration from its web server docs: a file in public/
# is served, anything else goes to public/index.php — no .htaccess needed.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

<VirtualHost {{listen}}>
  ServerName {{server_name}}
  {{ssl}}
  DocumentRoot "{{root}}/public"
  ErrorLog "{{log_dir}}/error.log"
  CustomLog "{{log_dir}}/access.log" common

  <Directory "{{root}}">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  <FilesMatch \.php$>
    SetHandler "proxy:fcgi://{{php}}/"
  </FilesMatch>

  # Uncomment the following line to force Apache to pass the Authorization
  # header to PHP: required for "basic_auth" under PHP-FPM and FastCGI
  #
  # SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

  <Directory "{{root}}/public">
    AllowOverride None
    Require all granted
    FallbackResource /index.php
  </Directory>
</VirtualHost>
