# Statamic, for nginx — a config template built into Wharf.
#
# Statamic's nginx configuration from its Ubuntu install guide, static
# caching rules included: a page Statamic cached in public/static/ is served
# as a file, anything else goes to public/index.php. SCRIPT_FILENAME comes
# after the include, which sets it too.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

server {
  {{listen}}
  {{ssl}}
  server_name {{server_name}};
  root "{{root}}/public";

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Content-Type-Options "nosniff";

  index index.html index.htm index.php;

  charset utf-8;

  set $try_location @static;

  if ($request_method != GET) {
    set $try_location @not_static;
  }

  if ($args ~* "live-preview=(.*)") {
    set $try_location @not_static;
  }

  location / {
    try_files $uri $try_location;
  }

  location @static {
    try_files /static${uri}_$args.html $uri $uri/ /index.php?$args;
  }

  location @not_static {
    try_files $uri /index.php?$args;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  error_page 404 /index.php;

  location ~ \.php$ {
    fastcgi_pass {{php}};
    fastcgi_index index.php;
    include "{{fastcgi}}";
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
