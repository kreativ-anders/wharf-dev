# WordPress, for nginx — a config template built into Wharf.
#
# WordPress's nginx guide for a single site: its global/restrictions.conf,
# then its global/wordpress.conf. The restrictions come first because nginx
# uses the first regex location that matches: after the PHP location, PHP in
# uploads would run. "expires max" is commented out: a browser caching CSS
# forever hides every change while developing.
#
# Wharf fills in every {{…}} for each project using this template; the
# rest is used as written:
#   {{listen}}       where the block listens — ports 80 and 443, or a
#                    loopback port behind Wharf's front door
#   {{ssl}}          the certificate lines while it serves HTTPS
#   {{server_name}}  <project>.localhost
#   {{root}}         the project's folder
#   {{log_dir}}      the project's log folder
#   {{php}}          the project's PHP, as host:port
#   {{fastcgi}}      (nginx) Wharf's FastCGI parameters, SCRIPT_FILENAME and
#                    the port and HTTPS the browser used included
# {{listen}}, {{ssl}} and {{server_name}} are required.
# A change saved here replaces Wharf's rules until "Restore" in Settings
# brings them back.

server {
  {{listen}}
  {{ssl}}
  server_name {{server_name}};
  root "{{root}}";
  index index.php;

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  # global/restrictions.conf
  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  location ~ /\. {
    deny all;
  }

  location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
  }

  # global/wordpress.conf
  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    include "{{fastcgi}}";
    fastcgi_intercept_errors on;
    fastcgi_pass {{php}};
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
    # expires max;
    log_not_found off;
  }
}
