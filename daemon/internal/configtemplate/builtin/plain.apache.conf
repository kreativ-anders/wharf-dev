<VirtualHost {{listen}}>
  ServerName {{server_name}}
  {{ssl}}
  DocumentRoot "{{root}}"
  ErrorLog "{{log_dir}}/error.log"
  CustomLog "{{log_dir}}/access.log" common

  <Directory "{{root}}">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  <FilesMatch \.php$>
    SetHandler "proxy:fcgi://{{php}}/"
  </FilesMatch>
</VirtualHost>
